name: AmneziaWG CI/CD

on:
  push:
    branches: [master]
    paths:
      - amneziawg/**
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare config
        env:
          WG_USERNAME: ${{ secrets.WG_USERNAME }}
          WG_PASSWORD: ${{ secrets.WG_PASSWORD }}
        run: |
          mkdir -p deploy
          python3 -c "
          import os
          content = open('amneziawg/docker-compose.yaml').read()
          for key in ('WG_USERNAME', 'WG_PASSWORD'):
              content = content.replace('%%' + key + '%%', os.environ[key].replace('\$', '\$\$'))
          open('deploy/docker-compose.yaml', 'w').write(content)
          "

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.yaml
          target: /app/amneziawg
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /app/amneziawg
            docker compose pull
            docker compose down
            docker compose up -d
