name: AmneziaWG CI/CD

on:
  push:
    branches: [master]
    paths:
      - amneziawg/**
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare config
        run: |
          mkdir -p deploy
          sed \
            -e "s|%%AWG_PASSWORD_HASH%%|${{ secrets.AWG_PASSWORD_HASH }}|" \
            amneziawg/docker-compose.yaml > deploy/docker-compose.yaml

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.yaml
          target: /app/amneziawg
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /app/amneziawg
            docker compose pull
            docker compose down
            docker compose up -d
