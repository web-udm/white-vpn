name: Hysteria 2 CI/CD

on:
  push:
    branches: [master]
    paths:
      - hysteria2/**
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare config
        run: |
          mkdir -p deploy
          cp hysteria2/docker-compose.yaml deploy/
          sed \
            -e "s|%%CF_TOKEN%%|${{ secrets.CLOUDFLARE_API_TOKEN }}|" \
            -e "s|%%PASSWORD%%|${{ secrets.HYSTERIA2_PASSWORD }}|" \
            -e "s|%%OBFS_PASSWORD%%|${{ secrets.HYSTERIA2_OBFS_PASSWORD }}|" \
            -e "s|%%HY2_PORT%%|${{ secrets.HYSTERIA2_PORT }}|" \
            hysteria2/hysteria.yaml > deploy/hysteria.yaml

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.yaml,deploy/hysteria.yaml
          target: /app/hysteria2
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /app/hysteria2
            docker compose pull
            docker compose down
            docker compose up -d
