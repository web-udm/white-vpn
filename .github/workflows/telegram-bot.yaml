name: Telegram Bot CI/CD

on:
  push:
    branches: ['**']
    #paths:
    #  - telegram-bot/**
  workflow_dispatch:

env:
  IMAGE: ghcr.io/web-udm/white-vpn-bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create .env for tests
        run: cp telegram-bot/.env.test telegram-bot/.env

      - name: Run PHPStan
        run: docker compose -f ./telegram-bot/docker-compose-testing.yaml run --rm app php vendor/bin/phpstan analyse --memory-limit=512M

      - name: Run PHPUnit
        run: docker compose -f ./telegram-bot/docker-compose-testing.yaml run --rm app sh -c "mkdir -p var/data && php bin/console doctrine:migrations:migrate --no-interaction && vendor/bin/phpunit"

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./telegram-bot
          file: ./telegram-bot/docker/franken/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:prod
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Prepare deploy files
        run: |
          mkdir -p deploy
          cp telegram-bot/docker-compose.prod.yaml deploy/docker-compose.yaml
          echo "${{ vars.ENV }}" > deploy/.env

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.yaml,deploy/.env
          target: /app/telegram-bot-prod
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /app/telegram-bot-prod
            docker compose pull
            docker compose down
            docker compose up -d
            sleep 5
            docker compose exec -T app sh -c "php bin/console doctrine:migrations:migrate --no-interaction"