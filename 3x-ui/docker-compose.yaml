services:
  3x-ui:
    container_name: 3x-ui
    image: ghcr.io/mhsanaei/3x-ui:latest
    volumes:
      - xui_db:/etc/x-ui/
      - xui_cert:/root/cert/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
    ports:
      - "2053:2053"
      - "2096:2096"
    restart: unless-stopped

volumes:
  xui_db:
  xui_cert: