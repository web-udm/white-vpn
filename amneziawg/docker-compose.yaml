services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    restart: unless-stopped
    ports:
      # снаружи слушаем порт relay, внутри wg-easy остаётся на своём 51820:
      # relay дилит на DEPLOY_HOST:RELAY_AWG_PORT, DNAT переписывает порт на 51820
      - "%%RELAY_AWG_PORT%%:51820/udp"
      # панель наружу не публикуем — до неё ходит только Caddy с host-сети
      - "127.0.0.1:51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PORT=51821
      - INSECURE=true
      - DISABLE_IPV6=true
      - EXPERIMENTAL_AWG=true
      - OVERRIDE_AUTO_AWG=awg
      - INIT_ENABLED=true
      - INIT_USERNAME=%%WG_USERNAME%%
      - INIT_PASSWORD=%%WG_PASSWORD%%
      # клиентов уводим на relay, а не на этот сервер: awg.whitevpn.tech занят
      # веб-панелью и резолвится сюда, прямой UDP из РФ до неё не доходит
      - INIT_HOST=whitevpn.tech
      - INIT_PORT=%%RELAY_AWG_PORT%%
      - INIT_DNS=1.1.1.1,8.8.8.8

volumes:
  etc_wireguard:
