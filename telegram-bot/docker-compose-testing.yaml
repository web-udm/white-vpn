services:
  app:
    container_name: bot_franken
    build:
      context: .
      dockerfile: docker/franken/Dockerfile
      network: host
    volumes:
      - ./:/app
    environment:
      APP_ENV: test
      SERVER_NAME:
    command:
        - php -d memory_limit=512M ./vendor/bin/phpstan analyse
        - ./vendor/bin/phpunit
    tty: true
